name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check tag matches project version
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi

      - name: Build and test
        run: mvn -B verify

      - name: End-to-end test
        run: e2e/run.sh

      - name: Generate checksum
        working-directory: target
        run: |
          zip=$(ls greptimedb-kafka-connect-*.zip)
          sha512sum "$zip" > "$zip.sha512"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/greptimedb-kafka-connect-*.zip \
            target/greptimedb-kafka-connect-*.zip.sha512 --generate-notes --verify-tag
